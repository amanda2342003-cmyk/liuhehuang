<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>澳门六合皇-必中波色-长期免费</title>
    <style>
        body {
            margin: 0;
            padding: 5px;
            background-color: #fff;
            color: #000;
        }
        .content {
            font-size: 14px;
            line-height: 1.6;
        }
    </style>
</head>
<body>

<div id="content-container" class="content"></div>

<script>
    const SPREADSHEET_ID = '19wtMwveTJ_eW09pp7ANQj1NkLNbHIA4kWLsoNAk5Xd8';
    const SHEET_NAME_KQ = 'KQ_AOMEN';
    const SHEET_NAME_DULIEU = 'DULIEU';

    const URL_KQ = `https://docs.google.com/spreadsheets/d/${SPREADSHEET_ID}/gviz/tq?tqx=out:json&sheet=${SHEET_NAME_KQ}&_=${Date.now()}`;
    const URL_DULIEU = `https://docs.google.com/spreadsheets/d/${SPREADSHEET_ID}/gviz/tq?tqx=out:json&sheet=${SHEET_NAME_DULIEU}&_=${Date.now()}`;

    let duLieuMap = {};

    const COLOR_MAP = {
        "红色": ["01", "02", "07", "08", "12", "13", "18", "19", "23", "24", "29", "30", "34", "35", "40", "45", "46"],
        "蓝色": ["03", "04", "09", "10", "14", "15", "20", "25", "26", "31", "36", "37", "41", "42", "47", "48"],
        "绿色": ["05", "06", "11", "16", "17", "21", "22", "27", "28", "32", "33", "38", "39", "43", "44", "49"]
    };

    const ALL_TWO_COLORS = [
        ["红色", "绿色"],
        ["红色", "蓝色"],
        ["绿色", "蓝色"]
    ];

    function fetchJSONP(url) {
        return fetch(url)
            .then(res => res.text())
            .then(text => {
                const match = text.match(/google\.visualization\.Query\.setResponse\(([\s\S]*)\)/);
                if (match && match[1]) return JSON.parse(match[1]);
                throw new Error(" ");
            });
    }

    function getPredictTwoColorsForKy(kyNum) {
        let index = (kyNum - 1) % ALL_TWO_COLORS.length;
        return ALL_TWO_COLORS[index];
    }

    function checkIsWin(predictedColors, numTe) {
        if (!numTe) return false;
        let formattedNum = formatTwoDigits(numTe);
        
        for (let color of predictedColors) {
            let nums = COLOR_MAP[color] || [];
            if (nums.includes(formattedNum)) {
                return true;
            }
        }
        return false;
    }

    // Chỉ bôi vàng chữ bên trong ngoặc 【】, không bôi dấu ngoặc
    function formatPredictionWithWinningHighlight(predictedColors, numTe) {
        let formattedNum = formatTwoDigits(numTe);
        let resultHtml = "";

        for (let color of predictedColors) {
            let nums = COLOR_MAP[color] || [];
            if (nums.includes(formattedNum)) {
                resultHtml += `【<span style="background-color:yellow; color:#FF0000; font-weight:bold;">${color}</span>】`;
            } else {
                resultHtml += `【${color}】`;
            }
        }
        return resultHtml;
    }

    function formatTwoDigits(val) {
        let cleanVal = String(val).trim();
        let num = parseInt(cleanVal.replace(/\D/g, ''), 10);
        if (isNaN(num)) return '';
        return String(num).padStart(2, '0');
    }

    function formatThreeDigits(val) {
        let num = parseInt(String(val).replace(/\D/g, ''), 10);
        if (isNaN(num)) return '001';
        return String(num).padStart(3, '0');
    }

    async function initPredict() {
        try {
            const rawRules = await fetchJSONP(URL_DULIEU);
            if (rawRules.table && rawRules.table.rows) {
                rawRules.table.rows.forEach(r => {
                    if (r.c && r.c[0] && r.c[0].v !== null && r.c[0].v !== undefined) {
                        let formattedNum = formatTwoDigits(r.c[0].v);
                        let animal = (r.c[1] && r.c[1].v !== null && r.c[1].v !== undefined) ? String(r.c[1].v).trim() : '';
                        if (formattedNum && animal) {
                            duLieuMap[formattedNum] = animal;
                        }
                    }
                });
            }

            const rawKQ = await fetchJSONP(URL_KQ);
            const rows = rawKQ.table.rows;
            let parsedList = [];

            if (rows) {
                for (let i = 0; i < rows.length; i++) {
                    const r = rows[i].c;
                    if (!r || !r[0] || r[0].v === null || r[0].v === undefined) continue;
                    
                    let kyRaw = String(r[0].v).trim();
                    let kyOnlyNum = parseInt(kyRaw.replace(/\D/g, ''), 10) || 0;
                    
                    let numTeFormatted = '';
                    if (r[7] && r[7].v !== null && r[7].v !== undefined) {
                        let valStr = String(r[7].v).trim();
                        if (valStr !== '' && valStr !== '0' && valStr !== '00') {
                            numTeFormatted = formatTwoDigits(valStr);
                        }
                    }

                    if (kyOnlyNum > 0) {
                        parsedList.push({
                            kyNum: kyOnlyNum,
                            numTe: numTeFormatted
                        });
                    }
                }
            }

            let doneList = [];
            let pendingKyObj = null;

            for (let i = 0; i < parsedList.length; i++) {
                let item = parsedList[i];
                let isDone = item.numTe !== '' && item.numTe !== '00';
                if (isDone) {
                    doneList.push(item);
                } else {
                    pendingKyObj = item;
                }
            }

            let targetPredictKy = 1;
            if (pendingKyObj) {
                targetPredictKy = pendingKyObj.kyNum;
            } else if (doneList.length > 0) {
                targetPredictKy = doneList[doneList.length - 1].kyNum + 1;
            }

            let evaluatedDoneList = [];
            for (let i = 0; i < doneList.length; i++) {
                let item = doneList[i];
                let predictedColors = getPredictTwoColorsForKy(item.kyNum);
                let actualAnimal = duLieuMap[item.numTe] || '';
                let isWin = checkIsWin(predictedColors, item.numTe);
                evaluatedDoneList.push({ item, predictedColors, actualAnimal, isWin });
            }

            let checkLatestMisses = 0;
            for (let i = evaluatedDoneList.length - 1; i >= 0; i--) {
                if (!evaluatedDoneList[i].isWin) {
                    checkLatestMisses++;
                } else {
                    break;
                }
            }

            let cutoffIndex = 0;
            if (checkLatestMisses < 3) {
                let consecutiveMisses = 0;
                for (let i = evaluatedDoneList.length - 1; i >= 0; i--) {
                    if (!evaluatedDoneList[i].isWin) {
                        consecutiveMisses++;
                        if (consecutiveMisses >= 3) {
                            cutoffIndex = i + 1;
                            break;
                        }
                    } else {
                        consecutiveMisses = 0;
                    }
                }
            } else {
                cutoffIndex = evaluatedDoneList.length;
            }

            let nextKyNum = targetPredictKy;
            let predictNextArr = getPredictTwoColorsForKy(nextKyNum);
            let kyStrNext = formatThreeDigits(nextKyNum);
            let predictNextStr = `【${predictNextArr[0]}】【${predictNextArr[1]}】`;

            let htmlNextKy = `<p>\n\t${kyStrNext}期:波路→${predictNextStr}(開:<span style="color: #FF0000">？00</span>)准!\n</p>`;

            let historyOutputs = [];

            if (checkLatestMisses < 3) {
                for (let i = cutoffIndex; i < evaluatedDoneList.length; i++) {
                    let entry = evaluatedDoneList[i];
                    if (entry.isWin) {
                        let resStrWin = entry.actualAnimal + entry.item.numTe;
                        let kyStr = formatThreeDigits(entry.item.kyNum);
                        
                        let formattedPredict = formatPredictionWithWinningHighlight(entry.predictedColors, entry.item.numTe);
                        
                        historyOutputs.push(`<p>\n\t${kyStr}期:波路→${formattedPredict}(開:<span style="color: #FF0000">${resStrWin}</span>)准!\n</p>`);
                    }
                }
            }

            historyOutputs.reverse();

            let finalOutputs = [htmlNextKy, ...historyOutputs];

            let currentCount = finalOutputs.length;
            if (currentCount === 1) {
                let kyStr1 = formatThreeDigits(nextKyNum + 1);
                let kyStr2 = formatThreeDigits(nextKyNum + 2);
                let defaultHtml1 = `<p>\n\t${kyStr1}期:波路→【發發】【發發】(開:<span style="color: #FF0000">？00</span>)准!\n</p>`;
                let defaultHtml2 = `<p>\n\t${kyStr2}期:波路→【發發】【發發】(開:<span style="color: #FF0000">？00</span>)准!\n</p>`;
                finalOutputs.unshift(defaultHtml1);
                finalOutputs.unshift(defaultHtml2);
            } else if (currentCount === 2) {
                let kyStrExtra = formatThreeDigits(nextKyNum + 1);
                let defaultHtmlExtra = `<p>\n\t${kyStrExtra}期:波路→【發發】【發發】(開:<span style="color: #FF0000">？00</span>)准!\n</p>`;
                finalOutputs.unshift(defaultHtmlExtra);
            }

            document.getElementById('content-container').innerHTML = finalOutputs.join('');

        } catch (err) {
            console.error(err);
            document.getElementById('content-container').innerHTML = ' ';
        }
    }
    initPredict();
</script>

</body>
</html>
