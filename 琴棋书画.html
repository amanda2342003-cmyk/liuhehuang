<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>琴棋书画</title>
    <style>
        :root {
            --container-width: 100%;
            --max-width: 1200px;
            --font-size: 18px;
        }

        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: transparent;
        }

        .data-container {
            width: var(--container-width);
            max-width: var(--max-width);
            margin: 0 auto;
            background-color: #ffffff;
            padding: 15px;
            box-sizing: border-box;
        }

        .data-container p {
            margin: 0 0 8px 0;
            padding: 2px 0;
            line-height: 1.5;
        }
    </style>
</head>
<body>

    <div id="content" class="data-container"></div>

    <script>
        const API_URL = "https://script.google.com/macros/s/AKfycbwqAInS7f9K7YgO0mJgGgUe_Example_URL/exec?sheet=KQ_AOMEN"; 
        const DEFAULT_VALUE = "發發";

        function sendHeight() {
            setTimeout(() => {
                const height = document.documentElement.scrollHeight || document.body.scrollHeight;
                window.parent.postMessage({ type: 'RESIZE_IFRAME_QINQI', height: height }, '*');
            }, 100);
        }

        function renderData(list) {
            const container = document.getElementById('content');
            if (!list || list.length === 0) {
                container.innerHTML = '';
                sendHeight();
                return;
            }

            let htmlStr = '';
            
            list.forEach(item => {
                const valDisplay = item.val ? item.val : DEFAULT_VALUE;
                htmlStr += `
<p>
	<span style="font-size:large;">${item.period}期【琴棋书画】?【</span><span style="color:#FF0000;font-size:large;">${valDisplay}</span><span style="font-size:large;">】开:？00准</span>&nbsp;
</p>`;
            });

            htmlStr += `
<br />
<br />
<p>
<span style="font-size:18px;">【棋】鼠牛狗</span>&nbsp;
</p>
<p>
<span style="font-size:18px;">【书】马龙虎</span>&nbsp;
</p>
<p>
<span style="font-size:18px;">【画】羊猴猪</span>&nbsp;
</p>
<p>
<span style="font-size:18px;">【琴】兔蛇鸡</span>&nbsp;
</p>`;

            container.innerHTML = htmlStr;
            sendHeight();
        }

        async function fetchData() {
            try {
                const response = await fetch(API_URL);
                const data = await response.json();
                renderData(data);
            } catch (error) {
                console.error(error);
            }
        }

        document.addEventListener('DOMContentLoaded', fetchData);
        window.addEventListener('resize', sendHeight);
    </script>
</body>
</html>
