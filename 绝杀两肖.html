        361: "猴狗", 362: "鸡鼠", 363: "牛虎", 364: "龙羊", 365: "鸡狗", 366: "虎鼠"
    };

    function fetchJSONP(url) {
        return fetch(url)
            .then(res => res.text())
            .then(text => {
                const match = text.match(/google\.visualization\.Query\.setResponse\(([\s\S]*)\)/);
                if (match && match[1]) return JSON.parse(match[1]);
                throw new Error(" ");
            });
    }

    function getPredictDanShuangForKy(kyNum) {
        let actualKy = ((kyNum - 1) % 366) + 1;
        return STATIC_PREDICTIONS[actualKy] || "虎龙";
    }

    function formatTwoDigits(val) {
        let num = parseInt(String(val).replace(/\D/g, ''), 10);
        if (isNaN(num)) return '';
        return String(num).padStart(2, '0');
    }

    function buildRowHtml(kyStr, predictStr, resultStr) {
        return `<p style="font-size:16px;line-height:25px;margin:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${kyStr}期：(绝杀二肖)✺<span style="color: #FF0000">${predictStr}</span>✺开：<span style="color: #FF0000">${resultStr}</span>准</p>`;
    }

    async function initPredict() {
        try {
            const rawRules = await fetchJSONP(URL_DULIEU);
            if (rawRules.table && rawRules.table.rows) {
                rawRules.table.rows.forEach(r => {
                    if (r.c && r.c[0] && r.c[0].v !== null && r.c[0].v !== undefined) {
                        let formattedNum = formatTwoDigits(r.c[0].v);
                        let animalB = (r.c[1] && r.c[1].v !== null && r.c[1].v !== undefined) ? String(r.c[1].v).trim() : '';
                        let animalE = (r.c[4] && r.c[4].v !== null && r.c[4].v !== undefined) ? String(r.c[4].v).trim() : '';
                        
                        if (formattedNum) {
                            if (animalB) duLieuMapB[formattedNum] = animalB;
                            if (animalE) duLieuMapE[formattedNum] = animalE;
                        }
                    }
                });
            }

            const rawKQ = await fetchJSONP(URL_KQ);
            const rows = rawKQ.table.rows;
            let parsedList = [];
            let lastXRowIndex = -1;

            if (rows) {
                for (let i = 0; i < rows.length; i++) {
                    const r = rows[i].c;
                    if (!r) continue;

                    let isXRow = false;
                    for (let colIdx = 1; colIdx <= 7; colIdx++) {
                        if (r[colIdx] && r[colIdx].v !== null && r[colIdx].v !== undefined) {
                            if (String(r[colIdx].v).trim().toLowerCase() === 'x') {
                                isXRow = true;
                                break;
                            }
                        }
                    }

                    if (isXRow) {
                        lastXRowIndex = i;
                        continue;
                    }

                    if (!r[0] || r[0].v === null || r[0].v === undefined) continue;

                    let kyRaw = String(r[0].v).trim();
                    let kyOnlyNum = parseInt(kyRaw.replace(/\D/g, ''), 10) || 0;
                    
                    let numTeFormatted = '';
                    if (r[7] && r[7].v !== null && r[7].v !== undefined) {
                        let valStr = String(r[7].v).trim();
                        if (valStr !== '' && valStr !== '0' && valStr !== '00') {
                            numTeFormatted = formatTwoDigits(r[7].v);
                        }
                    }

                    if (kyOnlyNum > 0) {
                        parsedList.push({
                            rowIndex: i,
                            kyNum: kyOnlyNum,
                            numTe: numTeFormatted
                        });
                    }
                }
            }

            let doneList = [];
            let pendingKyObj = null;

            for (let i = 0; i < parsedList.length; i++) {
                let item = parsedList[i];
                let isDone = item.numTe !== '';
                if (isDone) {
                    item.useMapE = (lastXRowIndex !== -1 && item.rowIndex > lastXRowIndex);
                    doneList.push(item);
                } else {
                    pendingKyObj = item;
                }
            }

            let targetPredictKy = 1;
            if (pendingKyObj) {
                targetPredictKy = pendingKyObj.kyNum;
            } else if (doneList.length > 0) {
                targetPredictKy = doneList[doneList.length - 1].kyNum + 1;
            }

            let evaluatedDoneList = [];
            for (let i = 0; i < doneList.length; i++) {
                let item = doneList[i];
                let predicted = getPredictDanShuangForKy(item.kyNum);
                
                let targetMap = item.useMapE ? duLieuMapE : duLieuMapB;
                let actualAnimal = targetMap[item.numTe] || '';
                let isValidNum = targetMap.hasOwnProperty(item.numTe);
                
                let isWin = isValidNum && actualAnimal && (!predicted.includes(actualAnimal));

                evaluatedDoneList.push({ item, isWin, actualAnimal });
            }

            let checkLatestDeletes = 0;
            for (let i = evaluatedDoneList.length - 1; i >= 0; i--) {
                if (!evaluatedDoneList[i].isWin) {
                    checkLatestDeletes++;
                } else {
                    break;
                }
            }

            let cutoffIndex = 0;
            if (checkLatestDeletes >= 3) {
                cutoffIndex = evaluatedDoneList.length;
            } else {
                let consecutiveDeletes = 0;
                for (let i = evaluatedDoneList.length - 1; i >= 0; i--) {
                    if (!evaluatedDoneList[i].isWin) {
                        consecutiveDeletes++;
                        if (consecutiveDeletes >= 3) {
                            cutoffIndex = i + 1;
                            break;
                        }
                    } else {
                        consecutiveDeletes = 0;
                    }
                }
            }

            let nextKyNum = targetPredictKy;
            let predictNext = getPredictDanShuangForKy(nextKyNum);
            let kyStrNext = String(nextKyNum).padStart(3, '0');

            let htmlNextKy = buildRowHtml(kyStrNext, predictNext, '？00');

            let historyOutputs = [];
            if (checkLatestDeletes < 3) {
                for (let i = cutoffIndex; i < doneList.length; i++) {
                    let item = doneList[i];
                    let evaluated = evaluatedDoneList.find(e => e.item.kyNum === item.kyNum);
                    if (evaluated && evaluated.isWin) {
                        let predicted = getPredictDanShuangForKy(item.kyNum);
                        let shengXiaoWin = evaluated.actualAnimal || '';
                        let resStrWin = shengXiaoWin + item.numTe;
                        let kyStr = String(item.kyNum).padStart(3, '0');
                        historyOutputs.push(buildRowHtml(kyStr, predicted, resStrWin));
                    }
                }
            }
            historyOutputs.reverse();

            if (historyOutputs.length > 14) {
                historyOutputs = historyOutputs.slice(0, 14);
            }

            let finalOutputs = [htmlNextKy, ...historyOutputs];

            let currentCount = finalOutputs.length;
            if (currentCount === 1) {
                let kyStr1 = String(nextKyNum + 1).padStart(3, '0');
                let kyStr2 = String(nextKyNum + 2).padStart(3, '0');
                let defaultHtml1 = buildRowHtml(kyStr1, '發發', '？00');
                let defaultHtml2 = buildRowHtml(kyStr2, '發發', '？00');
                finalOutputs.unshift(defaultHtml1);
                finalOutputs.unshift(defaultHtml2);
            } else if (currentCount === 2) {
                let kyStrExtra = String(nextKyNum + 1).padStart(3, '0');
                let defaultHtmlExtra = buildRowHtml(kyStrExtra, '發發', '？00');
                finalOutputs.unshift(defaultHtmlExtra);
            }

            document.getElementById('content-container').innerHTML = finalOutputs.join('');

        } catch (err) {
            console.error(err);
            document.getElementById('content-container').innerHTML = ' ';
        }
    }
    initPredict();
