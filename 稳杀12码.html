    function fetchJSONP(url) {
        return fetch(url)
            .then(res => res.text())
            .then(text => {
                const match = text.match(/google\.visualization\.Query\.setResponse\(([\s\S]*)\)/);
                if (match && match[1]) return JSON.parse(match[1]);
                throw new Error("Invalid response");
            });
    }

    // Lấy dự đoán 12 số cho các kỳ
    function getPredictForKy(kyNum) {
        if (STATIC_PREDICTIONS[kyNum]) {
            return STATIC_PREDICTIONS[kyNum];
        }

        let actualKy = ((kyNum - 1) % 100) + 1;
        if (STATIC_PREDICTIONS[actualKy]) {
            return STATIC_PREDICTIONS[actualKy];
        }
        
        let nums = [];
        for (let i = 1; i <= 12; i++) {
            let n = ((actualKy * i + 7) % 49) + 1;
            while (nums.includes(n)) {
                n = (n % 49) + 1;
            }
            nums.push(n);
        }
        nums.sort((a, b) => a - b);
        return nums.map(n => String(n).padStart(2, '0')).join('.');
    }

    function formatTwoDigits(val) {
        let num = parseInt(String(val).replace(/\D/g, ''), 10);
        if (isNaN(num)) return '';
        return String(num).padStart(2, '0');
    }

    // Phân tích chuỗi 12 số thành mảng
    function parsePredictNumbers(predictStr) {
        return predictStr.split('.')
            .map(s => parseInt(s.trim(), 10))
            .filter(n => !isNaN(n));
    }

    async function initPredict() {
        try {
            const rawRules = await fetchJSONP(URL_DULIEU);
            if (rawRules.table && rawRules.table.rows) {
                rawRules.table.rows.forEach(r => {
                    if (r.c && r.c[0] && r.c[0].v !== null && r.c[0].v !== undefined) {
                        let formattedNum = formatTwoDigits(r.c[0].v);
                        let animal = (r.c[1] && r.c[1].v !== null && r.c[1].v !== undefined) ? String(r.c[1].v).trim() : '';
                        if (formattedNum && animal) {
                            duLieuMap[formattedNum] = animal;
                        }
                    }
                });
            }

            const rawKQ = await fetchJSONP(URL_KQ);
            const rows = rawKQ.table.rows;
            let parsedList = [];

            if (rows) {
                for (let i = 0; i < rows.length; i++) {
                    const r = rows[i].c;
                    if (!r || !r[0] || r[0].v === null || r[0].v === undefined) continue;
                    
                    let kyRaw = String(r[0].v).trim();
                    let kyOnlyNum = parseInt(kyRaw.replace(/\D/g, ''), 10) || 0;
                    
                    let numTeFormatted = '';
                    if (r[7] && r[7].v !== null && r[7].v !== undefined) {
                        let valStr = String(r[7].v).trim();
                        if (valStr !== '' && valStr !== '0' && valStr !== '00') {
                            numTeFormatted = formatTwoDigits(r[7].v);
                        }
                    }

                    if (kyOnlyNum > 0) {
                        parsedList.push({
                            kyNum: kyOnlyNum,
                            numTe: numTeFormatted
                        });
                    }
                }
            }

            let doneList = [];
            let pendingKyObj = null;

            for (let i = 0; i < parsedList.length; i++) {
                let item = parsedList[i];
                let isDone = item.numTe !== '';
                if (isDone) {
                    doneList.push(item);
                } else {
                    pendingKyObj = item;
                }
            }

            let targetPredictKy = 1;
            if (pendingKyObj) {
                targetPredictKy = pendingKyObj.kyNum;
            } else if (doneList.length > 0) {
                targetPredictKy = doneList[doneList.length - 1].kyNum + 1;
            }

            let evaluatedDoneList = [];
            for (let i = 0; i < doneList.length; i++) {
                let item = doneList[i];
                let predictedStr = getPredictForKy(item.kyNum);
                let actualNum = parseInt(item.numTe, 10);
                
                let isValidRange = !isNaN(actualNum) && actualNum >= 1 && actualNum <= 49;
                let killNumbers = parsePredictNumbers(predictedStr);

                // Trúng khi số mở thưởng nằm trong khoảng 01-49 và KHÔNG thuộc danh sách 12 số bị tuyệt sát
                let isWin = isValidRange && !killNumbers.includes(actualNum);

                evaluatedDoneList.push({ item, isWin });
            }

            let checkLatestDeletes = 0;
            for (let i = evaluatedDoneList.length - 1; i >= 0; i--) {
                if (!evaluatedDoneList[i].isWin) {
                    checkLatestDeletes++;
                } else {
                    break;
                }
            }

            let cutoffIndex = 0;
            if (checkLatestDeletes >= 3) {
                cutoffIndex = evaluatedDoneList.length;
            } else {
                let consecutiveDeletes = 0;
                for (let i = evaluatedDoneList.length - 1; i >= 0; i--) {
                    if (!evaluatedDoneList[i].isWin) {
                        consecutiveDeletes++;
                        if (consecutiveDeletes >= 3) {
                            cutoffIndex = i + 1;
                            break;
                        }
                    } else {
                        consecutiveDeletes = 0;
                    }
                }
            }

            // Kỳ dự đoán chính (chưa mở thưởng)
            let nextKyNum = targetPredictKy;
            let predictNext = getPredictForKy(nextKyNum);
            let kyStrNext = String(nextKyNum).padStart(3, '0');

            // Định dạng HTML chuẩn
            let htmlNextKy = `<p style="margin:0px;font-weight:bold;">${kyStrNext}期：期杀★【<span style="color:#FF0000;">${predictNext}</span>】★开:<span style="color:#FF0000;">？00</span>准</p>`;

            let historyOutputs = [];
            if (checkLatestDeletes < 3) {
                for (let i = cutoffIndex; i < doneList.length; i++) {
                    let item = doneList[i];
                    let evaluated = evaluatedDoneList.find(e => e.item.kyNum === item.kyNum);
                    if (evaluated && evaluated.isWin) {
                        let predicted = getPredictForKy(item.kyNum);
                        let shengXiaoWin = duLieuMap[item.numTe] || '';
                        let resStrWin = shengXiaoWin + item.numTe;
                        let kyStr = String(item.kyNum).padStart(3, '0');
                        
                        historyOutputs.push(`<p style="margin:0px;font-weight:bold;">${kyStr}期：期杀★【<span style="color:#FF0000;">${predicted}</span>】★开:<span style="color:#FF0000;">${resStrWin}</span>准</p>`);
                    }
                }
            }
            historyOutputs.reverse();

            let finalOutputs = [htmlNextKy, ...historyOutputs];

            // Nếu lịch sử bị xóa do thua 3 kỳ liên tiếp, bổ sung các kỳ mặc định chứa $$.$$.$$.$$.$$.$$.$$.$$.$$.$$.$$.$$
            let defaultPlaceholder = "$$.$$.$$.$$.$$.$$.$$.$$.$$.$$.$$.$$";
            let currentCount = finalOutputs.length;
            if (currentCount === 1) {
                let kyStr1 = String(nextKyNum + 1).padStart(3, '0');
                let kyStr2 = String(nextKyNum + 2).padStart(3, '0');
                let defaultHtml1 = `<p style="margin:0px;font-weight:bold;">${kyStr1}期：期杀★【<span style="color:#FF0000;">${defaultPlaceholder}</span>】★开:<span style="color:#FF0000;">？00</span>准</p>`;
                let defaultHtml2 = `<p style="margin:0px;font-weight:bold;">${kyStr2}期：期杀★【<span style="color:#FF0000;">${defaultPlaceholder}</span>】★开:<span style="color:#FF0000;">？00</span>准</p>`;
                finalOutputs.unshift(defaultHtml1);
                finalOutputs.unshift(defaultHtml2);
            } else if (currentCount === 2) {
                let kyStrExtra = String(nextKyNum + 1).padStart(3, '0');
                let defaultHtmlExtra = `<p style="margin:0px;font-weight:bold;">${kyStrExtra}期：期杀★【<span style="color:#FF0000;">${defaultPlaceholder}</span>】★开:<span style="color:#FF0000;">？00</span>准</p>`;
                finalOutputs.unshift(defaultHtmlExtra);
            }

            document.getElementById('content-container').innerHTML = finalOutputs.join('');

        } catch (err) {
            console.error(err);
            document.getElementById('content-container').innerHTML = ' ';
        }
    }
    initPredict();
