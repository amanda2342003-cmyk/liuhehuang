        241: "3头", 242: "1头", 243: "2头", 244: "0头", 245: "4头", 246: "1头", 247: "3头", 248: "2头", 249: "4头", 250: "0头",
        251: "2头", 252: "1头", 253: "3头", 254: "0头", 255: "4头", 256: "3头", 257: "2头", 258: "1头", 259: "0头", 260: "4头",

        271: "3头", 272: "2头", 273: "1头", 274: "0头", 275: "4头", 276: "1头", 277: "3头", 278: "2头", 279: "4头", 280: "0头",
        281: "2头", 282: "1头", 283: "3头", 284: "0头", 285: "4头", 286: "3头", 287: "1头", 288: "2头", 289: "0头", 290: "4头",
        291: "1头", 292: "2头", 293: "3头", 294: "4头", 295: "0头", 296: "2头", 297: "3头", 298: "1头", 299: "0头", 300: "4头",

        321: "1头", 322: "2头", 323: "3头", 324: "4头", 325: "0头", 326: "2头", 327: "3头", 328: "1头", 329: "0头", 330: "4头",
        331: "3头", 332: "1头", 333: "2头", 334: "0头", 335: "4头", 336: "1头", 337: "2头", 338: "3头", 339: "4头", 340: "0头",
        341: "2头", 342: "3头", 343: "1头", 344: "0头", 345: "4头", 346: "3头", 347: "1头", 348: "2头", 349: "0头", 350: "4头",
        351: "1头", 352: "2头", 353: "3头", 354: "4头", 355: "0头", 356: "2头", 357: "3头", 358: "1头", 359: "0头", 360: "4头",
        361: "3头", 362: "1头", 363: "2头", 364: "0头", 365: "4头", 366: "1头"
    };

    function fetchJSONP(url) {
        return fetch(url)
            .then(res => res.text())
            .then(text => {
                const match = text.match(/google\.visualization\.Query\.setResponse\(([\s\S]*)\)/);
                if (match && match[1]) return JSON.parse(match[1]);
                throw new Error(" ");
            });
    }

    // Lấy đầu dự đoán cho từng kỳ
    function getPredictHeadForKy(kyNum) {
        let actualKy = ((kyNum - 1) % 366) + 1;
        if (STATIC_PREDICTIONS[actualKy]) {
            return STATIC_PREDICTIONS[actualKy];
        }
        return ALL_HEADS[actualKy % 5];
    }

    // Chuyển đổi số ra dạng Đầu (01-09 -> 0头, 10-19 -> 1头, v.v.)
    function getHeadFromNum(numStr) {
        let n = parseInt(numStr, 10);
        if (isNaN(n)) return '';
        if (n >= 1 && n <= 9) return '0头';
        if (n >= 10 && n <= 19) return '1头';
        if (n >= 20 && n <= 29) return '2头';
        if (n >= 30 && n <= 39) return '3头';
        if (n >= 40 && n <= 49) return '4头';
        return '';
    }

    function formatTwoDigits(val) {
        let cleanVal = String(val).trim();
        let num = parseInt(cleanVal.replace(/\D/g, ''), 10);
        if (isNaN(num)) return '';
        return String(num).padStart(2, '0');
    }

    function formatThreeDigits(val) {
        let num = parseInt(String(val).replace(/\D/g, ''), 10);
        if (isNaN(num)) return '001';
        return String(num).padStart(3, '0');
    }

    async function initPredict() {
        try {
            const rawRules = await fetchJSONP(URL_DULIEU);
            if (rawRules.table && rawRules.table.rows) {
                rawRules.table.rows.forEach(r => {
                    if (r.c && r.c[0] && r.c[0].v !== null && r.c[0].v !== undefined) {
                        let formattedNum = formatTwoDigits(r.c[0].v);
                        let animal = (r.c[1] && r.c[1].v !== null && r.c[1].v !== undefined) ? String(r.c[1].v).trim() : '';
                        if (formattedNum && animal) {
                            duLieuMap[formattedNum] = animal;
                        }
                    }
                });
            }

            const rawKQ = await fetchJSONP(URL_KQ);
            const rows = rawKQ.table.rows;
            let parsedList = [];

            if (rows) {
                for (let i = 0; i < rows.length; i++) {
                    const r = rows[i].c;
                    if (!r || !r[0] || r[0].v === null || r[0].v === undefined) continue;
                    
                    let kyRaw = String(r[0].v).trim();
                    let kyOnlyNum = parseInt(kyRaw.replace(/\D/g, ''), 10) || 0;
                    
                    let numTeFormatted = '';
                    if (r[7] && r[7].v !== null && r[7].v !== undefined) {
                        let valStr = String(r[7].v).trim();
                        if (valStr !== '' && valStr !== '0' && valStr !== '00') {
                            numTeFormatted = formatTwoDigits(valStr);
                        }
                    }

                    if (kyOnlyNum > 0) {
                        parsedList.push({
                            kyNum: kyOnlyNum,
                            numTe: numTeFormatted
                        });
                    }
                }
            }

            let doneList = [];
            let pendingKyObj = null;

            for (let i = 0; i < parsedList.length; i++) {
                let item = parsedList[i];
                let isDone = item.numTe !== '' && item.numTe !== '00';
                if (isDone) {
                    doneList.push(item);
                } else {
                    pendingKyObj = item;
                }
            }

            let targetPredictKy = 1;
            if (pendingKyObj) {
                targetPredictKy = pendingKyObj.kyNum;
            } else if (doneList.length > 0) {
                targetPredictKy = doneList[doneList.length - 1].kyNum + 1;
            }

            let evaluatedDoneList = [];
            for (let i = 0; i < doneList.length; i++) {
                let item = doneList[i];
                let predictedHead = getPredictHeadForKy(item.kyNum);
                let actualHead = getHeadFromNum(item.numTe);
                let actualAnimal = duLieuMap[item.numTe] || '';
                let isWin = actualHead !== '' && predictedHead === actualHead;
                evaluatedDoneList.push({ item, predictedHead, actualHead, actualAnimal, isWin });
            }

            let checkLatestMisses = 0;
            for (let i = evaluatedDoneList.length - 1; i >= 0; i--) {
                if (!evaluatedDoneList[i].isWin) {
                    checkLatestMisses++;
                } else {
                    break;
                }
            }

            let cutoffIndex = 0;
            if (checkLatestMisses < 3) {
                let consecutiveMisses = 0;
                for (let i = evaluatedDoneList.length - 1; i >= 0; i--) {
                    if (!evaluatedDoneList[i].isWin) {
                        consecutiveMisses++;
                        if (consecutiveMisses >= 3) {
                            cutoffIndex = i + 1;
                            break;
                        }
                    } else {
                        consecutiveMisses = 0;
                    }
                }
            } else {
                cutoffIndex = evaluatedDoneList.length;
            }

            let nextKyNum = targetPredictKy;
            let predictNext = getPredictHeadForKy(nextKyNum);
            let kyStrNext = formatThreeDigits(nextKyNum);

            let htmlNextKy = `<p style="font-family:'Microsoft YaHei',微软雅黑,sans-serif;font-size:17.3333px;text-align:left; background-color:#FFFFFF;">\n\t${kyStrNext}期【一头中特】=【<span style="color: #FF0000">${predictNext}</span>】开：<span style="color:#FF0000;">？00</span>准\n</p>`;

            let historyOutputs = [];

            if (checkLatestMisses < 3) {
                for (let i = cutoffIndex; i < evaluatedDoneList.length; i++) {
                    let entry = evaluatedDoneList[i];
                    if (entry.isWin) {
                        // Kết hợp Con Giáp + Số (Ví dụ: 鼠01)
                        let resStrWin = entry.actualAnimal + entry.item.numTe;
                        let kyStr = formatThreeDigits(entry.item.kyNum);
                        
                        // Highlight khi trúng thưởng (nền vàng, chữ đỏ đậm)
                        let formattedPredict = `<span style="background-color:yellow; color:#FF0000; font-weight:bold;">${entry.predictedHead}</span>`;
                        
                        historyOutputs.push(`<p style="font-family:'Microsoft YaHei',微软雅黑,sans-serif;font-size:17.3333px;text-align:left; background-color:#FFFFFF;">\n\t${kyStr}期【一头中特】=【${formattedPredict}】开：<span style="color:#FF0000;">${resStrWin}</span>准\n</p>`);
                    }
                }
            }

            historyOutputs.reverse();

            let finalOutputs = [htmlNextKy, ...historyOutputs];

            let currentCount = finalOutputs.length;
            if (currentCount === 1) {
                let kyStr1 = formatThreeDigits(nextKyNum + 1);
                let kyStr2 = formatThreeDigits(nextKyNum + 2);
                let defaultHtml1 = `<p style="font-family:'Microsoft YaHei',微软雅黑,sans-serif;font-size:17.3333px;text-align:left; background-color:#FFFFFF;">\n\t${kyStr1}期【一头中特】=【<span style="color: #FF0000">$头</span>】开：<span style="color:#FF0000;">？00</span>准\n</p>`;
                let defaultHtml2 = `<p style="font-family:'Microsoft YaHei',微软雅黑,sans-serif;font-size:17.3333px;text-align:left; background-color:#FFFFFF;">\n\t${kyStr2}期【一头中特】=【<span style="color: #FF0000">$头</span>】开：<span style="color:#FF0000;">？00</span>准\n</p>`;
                finalOutputs.unshift(defaultHtml1);
                finalOutputs.unshift(defaultHtml2);
            } else if (currentCount === 2) {
                let kyStrExtra = formatThreeDigits(nextKyNum + 1);
                let defaultHtmlExtra = `<p style="font-family:'Microsoft YaHei',微软雅黑,sans-serif;font-size:17.3333px;text-align:left; background-color:#FFFFFF;">\n\t${kyStrExtra}期【一头中特】=【<span style="color: #FF0000">$头</span>】开：<span style="color:#FF0000;">？00</span>准\n</p>`;
                finalOutputs.unshift(defaultHtmlExtra);
            }

            document.getElementById('content-container').innerHTML = finalOutputs.join('');

        } catch (err) {
            console.error(err);
            document.getElementById('content-container').innerHTML = ' ';
        }
    }
    initPredict();
</script>
