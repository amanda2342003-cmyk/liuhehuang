    function fetchJSONP(url) {
        return fetch(url)
            .then(res => res.text())
            .then(text => {
                const match = text.match(/google\.visualization\.Query\.setResponse\(([\s\S]*)\)/);
                if (match && match[1]) return JSON.parse(match[1]);
                throw new Error(" ");
            });
    }

    // Lấy 4 con giáp cho mỗi kỳ
    function getPredictFourAnimalsForKy(kyNum) {
        let actualKy = ((kyNum - 1) % 366) + 1;
        if (STATIC_PREDICTIONS[actualKy]) {
            return STATIC_PREDICTIONS[actualKy];
        }
        let idx1 = (actualKy * 3) % 12;
        let idx2 = (actualKy * 5 + 1) % 12;
        let idx3 = (actualKy * 7 + 2) % 12;
        let idx4 = (actualKy * 11 + 3) % 12;
        
        let selected = Array.from(new Set([ALL_ANIMALS[idx1], ALL_ANIMALS[idx2], ALL_ANIMALS[idx3], ALL_ANIMALS[idx4]]));
        while (selected.length < 4) {
            for (let a of ALL_ANIMALS) {
                if (!selected.includes(a)) {
                    selected.push(a);
                    if (selected.length === 4) break;
                }
            }
        }
        return selected.join("");
    }

    function formatTwoDigits(val) {
        let cleanVal = String(val).trim();
        let num = parseInt(cleanVal.replace(/\D/g, ''), 10);
        if (isNaN(num)) return '';
        return String(num).padStart(2, '0');
    }

    function formatThreeDigits(val) {
        let num = parseInt(String(val).replace(/\D/g, ''), 10);
        if (isNaN(num)) return '001';
        return String(num).padStart(3, '0');
    }

                        let formattedPredictHtml = fourChars.map(char => {
                            if (char === entry.actualAnimal) {
                                return `<span style="color:#FF0000; background-color:yellow; font-weight:bold;">${char}</span>`;
                            }
                            return char;
                        }).join('');
                        
                        historyOutputs.push(`<p style="font-size:14px;">\n\t${kyStr}期：<span style="color:#00FF00;">【</span><span style="color:#FF00FF;">四肖中特</span><span style="color:#00FF00;">】</span><span style="color:#0000FF;">☆</span><span style="color:#00FF00;">【</span>${formattedPredictHtml}<span style="color:#00FF00;">】</span>开：<span style="color:#3333FF;">${resStrWin}</span>准\n</p>`);
                    }
                }
            }

            historyOutputs.reverse();

            let finalOutputs = [htmlNextKy, ...historyOutputs];

            let currentCount = finalOutputs.length;
            if (currentCount === 1) {
                let kyStr1 = formatThreeDigits(nextKyNum + 1);
                let kyStr2 = formatThreeDigits(nextKyNum + 2);
                let defaultHtml1 = `<p style="font-size:14px;">\n\t${kyStr1}期：<span style="color:#00FF00;">【</span><span style="color:#FF00FF;">四肖中特</span><span style="color:#00FF00;">】</span><span style="color:#0000FF;">☆</span><span style="color:#00FF00;">【</span>發發發發<span style="color:#00FF00;">】</span>开：<span style="color:#3333FF;">？00</span>准\n</p>`;
                let defaultHtml2 = `<p style="font-size:14px;">\n\t${kyStr2}期：<span style="color:#00FF00;">【</span><span style="color:#FF00FF;">四肖中特</span><span style="color:#00FF00;">】</span><span style="color:#0000FF;">☆</span><span style="color:#00FF00;">【</span>發發發發<span style="color:#00FF00;">】</span>开：<span style="color:#3333FF;">？00</span>准\n</p>`;
                finalOutputs.unshift(defaultHtml1);
                finalOutputs.unshift(defaultHtml2);
            } else if (currentCount === 2) {
                let kyStrExtra = formatThreeDigits(nextKyNum + 1);
                let defaultHtmlExtra = `<p style="font-size:14px;">\n\t${kyStrExtra}期：<span style="color:#00FF00;">【</span><span style="color:#FF00FF;">四肖中特</span><span style="color:#00FF00;">】</span><span style="color:#0000FF;">☆</span><span style="color:#00FF00;">【</span>發發發發<span style="color:#00FF00;">】</span>开：<span style="color:#3333FF;">？00</span>准\n</p>`;
                finalOutputs.unshift(defaultHtmlExtra);
            }

            document.getElementById('content-container').innerHTML = finalOutputs.join('');

        } catch (err) {
            console.error(err);
            document.getElementById('content-container').innerHTML = ' ';
        }
    }
    initPredict();
</script>
